# Render "Blueprint": tells Render how to deploy this repo.
# In Render: New > Blueprint > pick this GitHub repo. It reads this file
# and creates the service. Other hosts ignore this file and just use the Dockerfile.
services:
  - type: web
    name: resume-refiner
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Secret: set its value in Render > resume-refiner > Environment.
      # `sync: false` means the value is never stored in this file.
      # With ANTHROPIC_API_KEY set, the site uses Claude; otherwise Gemini.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      # Shown to users in the privacy notice. Change to "paid" with a paid key.
      - key: GEMINI_TIER
        value: free
